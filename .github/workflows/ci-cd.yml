name: SparkX Backend CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-compile:
    name: TypeScript Compilation & API Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compile TypeScript
        run: npm run build

      - name: Validation Summary
        run: echo "SparkX Backend TypeScript Compilation Passed Cleanly!"
